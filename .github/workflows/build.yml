name: Build Skell-Necromancer (Windows VST3)
on:
  workflow_dispatch:
  push:
    paths:
      - 'Source/**'
      - 'SkellCore/**'
      - 'Assets/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'Source/**'
      - 'SkellCore/**'
      - 'Assets/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'

# New UI/DSP commits supersede older builds of the same branch.
concurrency:
  group: necromancer-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: DSP regression tests
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Source integrity
        run: python tests/test_project_structure.py
      - name: Independent LUFS / 8x true-peak reference checks
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet numpy scipy pyloudnorm
          python tests/test_reference_metering.py --lufs "build/Release/NecromancerLufsProbe.exe" --limiter "build/Release/NecromancerLimiterProbe.exe"
      - name: Package
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle missing' }
          Compress-Archive -Path $plugin.FullName -DestinationPath Skell-Necromancer-Windows-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: Skell-Necromancer-Windows-VST3
          path: Skell-Necromancer-Windows-VST3.zip
          if-no-files-found: error
