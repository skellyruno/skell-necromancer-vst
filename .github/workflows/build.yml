name: Build Skell-Necromancer (Windows VST3)
on:
  workflow_dispatch:
  push:
    branches: [main, production]
    paths:
      - 'Source/**'
      - 'SkellCore/**'
      - 'Assets/**'
      - 'tests/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'Source/**'
      - 'SkellCore/**'
      - 'Assets/**'
      - 'tests/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'

# Only superseded automatic PR runs on non-protected branches may cancel.
# Manual runs get unique groups; main, production and release refs are protected.
concurrency:
  group: necromancer-windows-${{ github.event.pull_request.head.ref || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/tags/') && (github.event_name != 'pull_request' || (github.event.pull_request.head.ref != 'main' && github.event.pull_request.head.ref != 'production' && !startsWith(github.event.pull_request.head.ref, 'release/'))) }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: DSP regression tests
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Source integrity
        run: python tests/test_project_structure.py
      - name: VST3 package gate regressions
        run: python -m unittest discover -s tests -p "test_vst3_package.py" -v
      - name: Independent LUFS / 8x true-peak reference checks
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet numpy scipy pyloudnorm
          python tests/test_reference_metering.py --lufs "build/Release/NecromancerLufsProbe.exe" --limiter "build/Release/NecromancerLimiterProbe.exe"
      - name: Package and verify Windows VST3
        run: >
          python tools/package_vst3.py
          --build-dir build
          --expected-bundle "build/SkellNecromancer_artefacts/Release/VST3/Skell-Necromancer.vst3"
          --output "Skell-Necromancer-Windows-VST3.zip"
          --manifest "Skell-Necromancer-Windows-VST3.manifest.json"
          --name "Skell-Necromancer"
          --version "0.1.0"
          --vendor "Skell Audio"
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: Skell-Necromancer-Windows-VST3
          path: |
            Skell-Necromancer-Windows-VST3.zip
            Skell-Necromancer-Windows-VST3.manifest.json
          if-no-files-found: error
