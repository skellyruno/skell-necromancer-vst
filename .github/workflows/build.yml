name: Build Skell-Necromancer (Windows VST3)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - 'SkellCore/**'
      - 'Assets/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'Source/**'
      - 'SkellCore/**'
      - 'Assets/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'

# New UI/DSP commits supersede older builds of the same branch.
concurrency:
  group: necromancer-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure
        run: cmake -S . -B build -A x64 -DSKELL_BUILD_UI_CAPTURE=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Verify VST3-only product output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $productRoot = Join-Path $PWD 'build/SkellNecromancer_artefacts/Release'
          $vst3 = Join-Path $productRoot 'VST3/Skell-Necromancer.vst3'
          $standalone = Join-Path $productRoot 'Standalone/Skell-Necromancer.exe'
          if (-not (Test-Path -LiteralPath $vst3 -PathType Container)) { throw "Expected Windows VST3 bundle missing: $vst3" }
          if (Test-Path -LiteralPath $standalone) { throw "Unexpected plugin Standalone executable: $standalone" }
          $bundles = @(Get-ChildItem -LiteralPath 'build' -Recurse -Directory -Filter 'Skell-Necromancer.vst3')
          if ($bundles.Count -ne 1) { throw "Expected exactly one Skell-Necromancer.vst3 bundle, found $($bundles.Count)" }
      - name: DSP regression tests
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Source integrity
        run: python tests/test_project_structure.py
      - name: Reference UI geometry and resize checks
        run: python tests/test_reference_ui_layout.py
      - name: Independent LUFS / 8x true-peak reference checks
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet numpy scipy pyloudnorm
          python tests/test_reference_metering.py --lufs "build/Release/NecromancerLufsProbe.exe" --limiter "build/Release/NecromancerLimiterProbe.exe"
      - name: Capture real JUCE UI and verify silent rune motion
        shell: pwsh
        run: |
          $uiExe = Get-ChildItem -Path build -Recurse -File -Filter 'NecromancerUICapture.exe' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $uiExe) { throw 'Compiled JUCE UI capture executable not found' }
          & $uiExe "build/ui-captures"
          if ($LASTEXITCODE -ne 0) { throw "JUCE UI capture or rune motion verification failed" }
      - name: Package verifier regression tests
        run: python tests/test_vst3_packager.py
      - name: Package and verify Windows x64 VST3
        run: python tools/package_vst3.py --build-root build --source-root . --output Skell-Necromancer-Windows-VST3.zip
      - name: Extract verified VST3 bundle for pluginval
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'pluginval-stage'
          if (Test-Path -LiteralPath $stage) { throw "Refusing to reuse existing pluginval staging directory: $stage" }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Expand-Archive -LiteralPath 'Skell-Necromancer-Windows-VST3.zip' -DestinationPath $stage
          $bundles = @(Get-ChildItem -LiteralPath $stage -Directory -Filter '*.vst3')
          if ($bundles.Count -ne 1) { throw "Expected exactly one staged VST3 bundle, found $($bundles.Count)" }
          $binary = Join-Path $bundles[0].FullName 'Contents/x86_64-win/Skell-Necromancer.vst3'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Staged Windows VST3 module missing: $binary" }
          "PLUGINVAL_BUNDLE=$($bundles[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install pinned pluginval 1.0.4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' -OutFile pluginval_Windows.zip
          Expand-Archive -LiteralPath pluginval_Windows.zip -DestinationPath pluginval -Force
          $validator = Get-ChildItem -LiteralPath pluginval -Recurse -File -Filter 'pluginval.exe' | Select-Object -First 1
          if (-not $validator) { throw 'Official pluginval 1.0.4 Windows executable was not found' }
          "PLUGINVAL_EXE=$($validator.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate staged Necromancer VST3 (strictness 5)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportDir = Join-Path $PWD 'pluginval-reports'
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null
          $stdoutPath = Join-Path $reportDir 'pluginval.stdout.log'
          $stderrPath = Join-Path $reportDir 'pluginval.stderr.log'
          $argumentLine = '--strictness-level 5 --validate-in-process --output-dir "{0}" "{1}"' -f $reportDir, $env:PLUGINVAL_BUNDLE
          $process = Start-Process -FilePath $env:PLUGINVAL_EXE -ArgumentList $argumentLine -Wait -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          if (Test-Path -LiteralPath $stdoutPath) { Get-Content -LiteralPath $stdoutPath | ForEach-Object { Write-Host $_ } }
          if (Test-Path -LiteralPath $stderrPath) { Get-Content -LiteralPath $stderrPath | ForEach-Object { Write-Host $_ } }
          if ($process.ExitCode -ne 0) { throw "pluginval strictness 5 failed with process exit code $($process.ExitCode)" }
          $reports = @(Get-ChildItem -LiteralPath $reportDir -File -Filter '*.txt')
          if ($reports.Count -ne 1) { throw "Expected exactly one pluginval text report, found $($reports.Count)" }
          $reportText = Get-Content -LiteralPath $reports[0].FullName -Raw
          if (-not $reportText.Trim().EndsWith('SUCCESS') -or $reportText.Contains('FAILURE')) {
            throw 'pluginval report does not contain a clean final SUCCESS marker'
          }
      - name: Upload pluginval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Skell-Necromancer-pluginval-report
          path: pluginval-reports/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          name: Skell-Necromancer-Windows-VST3
          path: |
            Skell-Necromancer-Windows-VST3.zip
            Skell-Necromancer-Windows-VST3.manifest.json
            Skell-Necromancer-Windows-VST3.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: Skell-Necromancer-UI-Review
          path: build/ui-captures/*.png
          if-no-files-found: error

      - name: Assemble private-preview install package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'release-package'
          if (Test-Path -LiteralPath $stage) { throw "Refusing to reuse release package directory: $stage" }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Expand-Archive -LiteralPath 'Skell-Necromancer-Windows-VST3.zip' -DestinationPath $stage

          $bundle = Join-Path $stage 'Skell-Necromancer.vst3'
          $moduleInfoPath = Join-Path $bundle 'Contents/Resources/moduleinfo.json'
          $binaryPath = Join-Path $bundle 'Contents/x86_64-win/Skell-Necromancer.vst3'
          $manifestPath = Join-Path $PWD 'Skell-Necromancer-Windows-VST3.manifest.json'
          foreach ($required in @($moduleInfoPath, $binaryPath, $manifestPath)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Required staged release file is missing: $required" }
          }

          $baseManifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json -AsHashtable -ErrorAction Stop
          if ($baseManifest.product -ne 'Skell-Necromancer' -or $baseManifest.vendor -ne 'Skell Audio' -or
              $baseManifest.version -ne '0.1.0' -or $baseManifest.format -ne 'VST3' -or
              $baseManifest.platform -ne 'windows-x64' -or $baseManifest.architecture -ne 'AMD64' -or
              $baseManifest.commercial_release -ne $false) {
            throw 'Base VST3 manifest does not match the approved private-preview identity'
          }
          if ($baseManifest.source_commit -ne $env:SOURCE_COMMIT -or
              $baseManifest.ci_checkout_commit -ne $env:GITHUB_SHA -or
              $baseManifest.workflow_run_id -ne $env:GITHUB_RUN_ID) {
            throw 'Base VST3 manifest provenance does not match this exact workflow run'
          }

          $moduleInfo = [System.IO.File]::ReadAllText($moduleInfoPath) | ConvertFrom-Json -AsHashtable -ErrorAction Stop
          if ($moduleInfo.Name -ne 'Skell-Necromancer' -or $moduleInfo.Version -ne '0.1.0' -or
              $moduleInfo['Factory Info'].Vendor -ne 'Skell Audio') {
            throw 'Staged VST3 moduleinfo identity mismatch'
          }
          $classIds = @($moduleInfo.Classes | ForEach-Object { ([string]$_.CID).ToLowerInvariant() } | Sort-Object)
          $expectedIds = @('abcdef019182faeb536b4175536e4372', 'abcdef011234abcd536b4175536e4372')
          if (($classIds -join '|') -ne (($expectedIds | Sort-Object) -join '|')) {
            throw 'Staged VST3 class IDs differ from the preserved processor/controller identity'
          }

          $binaryHash = (Get-FileHash -LiteralPath $binaryPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $moduleInfoHash = (Get-FileHash -LiteralPath $moduleInfoPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($binaryHash -ne $baseManifest.binary_sha256 -or $moduleInfoHash -ne $baseManifest.moduleinfo_sha256) {
            throw 'Extracted VST3 binary/moduleinfo hashes differ from the verified base package manifest'
          }
          if ([string]::IsNullOrWhiteSpace($env:SOURCE_COMMIT) -or
              [string]::IsNullOrWhiteSpace($env:GITHUB_SHA) -or
              [string]::IsNullOrWhiteSpace($env:GITHUB_RUN_ID)) {
            throw 'Exact source/CI provenance environment values are required'
          }

          Copy-Item -LiteralPath 'scripts/Install-Skell-NecromancerPreview.ps1' -Destination (Join-Path $stage 'Install-Skell-NecromancerPreview.ps1')
          Copy-Item -LiteralPath 'docs/WINDOWS-VST3-INSTALL.md' -Destination (Join-Path $stage 'WINDOWS-VST3-INSTALL.md')
          Copy-Item -LiteralPath 'docs/THIRD_PARTY_NOTICES.md' -Destination (Join-Path $stage 'THIRD_PARTY_NOTICES.md')
          $previewLines = @(
            'SKELL-NECROMANCER 0.1.0 — PRIVATE WINDOWS VST3 PREVIEW'
            'This package is unsigned and preview-only; it is not a commercial release.'
            'FL Studio acceptance, owner listening approval, target-hardware CPU/latency, vendor/support metadata, licensing and commercial approval remain open.'
            'SHA-256 manifests detect accidental corruption; they are not digital signatures.'
          )
          [System.IO.File]::WriteAllLines(
            (Join-Path $stage 'PREVIEW-ONLY.txt'),
            [string[]]$previewLines,
            [System.Text.UTF8Encoding]::new($false)
          )

          $buildInfo = [ordered]@{
            schema_version = 1
            product = [string]$baseManifest.product
            vendor = [string]$baseManifest.vendor
            version = [string]$baseManifest.version
            format = 'VST3'
            platform = 'windows-x64'
            release_status = 'preview-only'
            source_commit = [string]$baseManifest.source_commit
            ci_checkout_commit = [string]$baseManifest.ci_checkout_commit
            workflow_run_id = [string]$baseManifest.workflow_run_id
            workflow_attempt = [string]$baseManifest.workflow_attempt
            bundle_archive = [string]$baseManifest.archive
            bundle_archive_sha256 = [string]$baseManifest.archive_sha256
            bundle_archive_size_bytes = [long]$baseManifest.archive_size_bytes
            binary = [ordered]@{
              path = 'Skell-Necromancer.vst3/Contents/x86_64-win/Skell-Necromancer.vst3'
              size_bytes = (Get-Item -LiteralPath $binaryPath).Length
              sha256 = $binaryHash
              architecture = 'AMD64'
              pe_format = 'PE32+'
            }
            moduleinfo = [ordered]@{
              path = 'Skell-Necromancer.vst3/Contents/Resources/moduleinfo.json'
              sha256 = $moduleInfoHash
              strict_json = $true
              unique_class_ids = $classIds
              normalization_applied = [bool]$baseManifest.moduleinfo_normalized
            }
            validation = [ordered]@{
              windows_build = 'passed'
              ctest = 'passed'
              package_verifier = 'passed'
              bundle_structure = 'passed'
              metadata_identity = 'passed'
              pe32_plus_amd64 = 'passed'
              pluginval = [ordered]@{ strictness_level = 5; result = 'passed' }
            }
            commercial_metadata_gate = [ordered]@{
              status = 'blocked'
              blockers = @(
                'Owner-approved HTTPS vendor URL is not configured',
                'Owner-approved support email is not configured',
                'Owner-approved root product LICENSE or COPYING is not configured'
              )
            }
            vendor_url = [string]$baseManifest.vendor_url
            support_email = [string]$baseManifest.support_email
            commercial_release = $false
            license_file = $null
            third_party_notices = @($baseManifest.third_party_notices)
            release_blockers = @(
              'FL Studio scan/load, save/reopen, automation and old-project compatibility are not accepted',
              'Real musical A/B and owner listening approval are pending',
              'Target Windows hardware CPU and latency are not measured',
              'Vendor URL, support email and product license require owner approval',
              'Third-party asset rights and attribution review remain pending',
              'Code signing and commercial release approval remain pending'
            )
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $stage 'build-info.json'),
            (ConvertTo-Json -InputObject $buildInfo -Depth 12),
            [System.Text.UTF8Encoding]::new($false)
          )

          $reparsePoints = @(Get-ChildItem -LiteralPath $stage -Recurse -Force | Where-Object {
            ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
          })
          if ($reparsePoints.Count -ne 0) { throw 'Preview package contains a reparse point' }
          $checksumLines = foreach ($file in (Get-ChildItem -LiteralPath $stage -File -Recurse -Force | Sort-Object FullName)) {
            $relative = [IO.Path]::GetRelativePath($stage, $file.FullName).Replace('\', '/')
            if ($relative -eq 'SHA256SUMS.txt') { continue }
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path $stage 'SHA256SUMS.txt'),
            [string[]]$checksumLines,
            [System.Text.Encoding]::ASCII
          )
          Write-Host "Private preview staged with $($checksumLines.Count) SHA-256 protected files; no commercial license/contact data was invented."

      - name: Run installer update and rollback self-tests
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Install-Skell-NecromancerPreview.ps1 -SelfTest

      - name: Verify real preview package with no filesystem changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs/Common/VST3'
          $backupRoot = Join-Path $env:LOCALAPPDATA 'Skelly/Backups/Skell-Necromancer'
          $installExisted = Test-Path -LiteralPath $installRoot
          $backupExisted = Test-Path -LiteralPath $backupRoot
          pwsh -NoProfile -File scripts/Install-Skell-NecromancerPreview.ps1 -PackageRoot release-package -WhatIf
          if ($LASTEXITCODE -ne 0) { throw "Preview installer -WhatIf validation failed with exit code $LASTEXITCODE" }
          if (-not $installExisted -and (Test-Path -LiteralPath $installRoot)) { throw 'WhatIf unexpectedly created the VST3 install destination' }
          if (-not $backupExisted -and (Test-Path -LiteralPath $backupRoot)) { throw 'WhatIf unexpectedly created the backup directory' }

      - name: Upload private-preview installer package
        uses: actions/upload-artifact@v4
        with:
          name: Skell-Necromancer-Private-Preview
          path: release-package/
          if-no-files-found: error
          retention-days: 14

